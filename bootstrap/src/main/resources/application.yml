server:
  port: 8080

spring:
  application:
    name: channel-link
  datasource:
    url: jdbc:h2:mem:channel-link;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  main:
    web-application-type: servlet
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
    cache-names: hotelMappingsBySupplier
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

channel-link:
  supplier:
    api-key: mock-api-key
    a:
      base-url: http://localhost:9090
    b:
      base-url: http://localhost:9090
